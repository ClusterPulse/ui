<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/openshift-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monitor your OpenShift clusters in real-time" />
    <meta name="theme-color" content="#ee0000" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>ClusterPulse</title>
    
    <!-- PF v6 theme initialization -->
    <script>
      (function() {
        const saved = localStorage.getItem('openshift-monitor-theme-v2');
        let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved) {
          try { isDark = JSON.parse(saved).state?.isDarkTheme || false; } catch {}
        }
        const html = document.documentElement;
        if (isDark) html.classList.add('pf-v6-theme-dark');
        html.setAttribute('data-theme', isDark ? 'dark' : 'light');
      })();
    </script>
    
    <style>
      :root { font-family: 'Red Hat Text', sans-serif; color-scheme: light dark; }
      body { margin: 0; background: var(--pf-t--global--background--color--primary--default, #fff); color: var(--pf-t--global--text--color--regular, #151515); }
      #loading-screen { position: fixed; inset: 0; background: var(--pf-t--global--background--color--primary--default, #fff); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
      #loading-screen.fade-out { opacity: 0; transition: opacity 0.3s; pointer-events: none; }
      .loading-logo { width: 100px; height: 100px; margin-bottom: 2rem; animation: pulse 2s ease-in-out infinite; }
      .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--pf-t--global--border--color--default, #d2d2d2); border-top-color: #ee0000; border-radius: 50%; animation: spin 1s linear infinite; }
      .loading-text { margin-top: 1rem; color: var(--pf-t--global--text--color--subtle, #6a6e73); font-size: 0.875rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <img src="/src/assets/logo.svg" alt="ClusterPulse" class="loading-logo" />
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading ClusterPulse...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const ls = document.getElementById('loading-screen');
          if (ls) { ls.classList.add('fade-out'); setTimeout(() => ls.remove(), 300); }
        }, 500);
      });
    </script>
    <noscript><div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem"><div><h1>JavaScript Required</h1><p>ClusterPulse requires JavaScript.</p></div></div></noscript>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/openshift-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monitor your OpenShift clusters in real-time" />
    <meta name="theme-color" content="#ee0000" />
    
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load Red Hat fonts early -->
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <title>ClusterPulse</title>
    
    <!-- Apply theme before render to prevent flash -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('clusterpulse-theme');
          if (saved) {
            const data = JSON.parse(saved);
            if (data.state?.isDarkTheme) {
              document.documentElement.classList.add('pf-v6-theme-dark');
            }
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('pf-v6-theme-dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <style>
      /* Critical CSS - explicit colors since PF not loaded */
      body {
        margin: 0;
        font-family: 'Red Hat Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fff;
        color: #151515;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html.pf-v6-theme-dark body {
        background: #1b1d21;
        color: #e0e0e0;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: inherit;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 2rem;
        animation: pulse 2s ease-in-out infinite;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #d2d2d2;
        border-top-color: #ee0000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      html.pf-v6-theme-dark .loading-spinner {
        border-color: #444;
        border-top-color: #ee0000;
      }
      .loading-text {
        margin-top: 1rem;
        font-family: 'Red Hat Display', sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #6a6e73;
      }
      html.pf-v6-theme-dark .loading-text {
        color: #a0a0a0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <img src="/src/assets/logo.svg" alt="ClusterPulse" class="loading-logo" />
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading ClusterPulse...</div>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/index.tsx"></script>
    
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const ls = document.getElementById('loading-screen');
          if (ls) {
            ls.classList.add('fade-out');
            setTimeout(() => ls.remove(), 300);
          }
        }, 300);
      });
    </script>
    
    <noscript>
      <style>#loading-screen { display: none; }</style>
      <div style="padding: 2rem; text-align: center; font-family: 'Red Hat Text', sans-serif;">
        <h1 style="font-family: 'Red Hat Display', sans-serif;">JavaScript Required</h1>
        <p>Please enable JavaScript to use ClusterPulse.</p>
      </div>
    </noscript>
  </body>
</html>
